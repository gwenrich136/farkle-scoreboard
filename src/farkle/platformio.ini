; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
build_flags = -Iinclude
lib_extra_dirs = lib/components
lib_deps = 
  olikraus/U8g2@^2.35.8
  adafruit/Adafruit NeoPixel@^1.12.0
  majicdesigns/MD_MAX72XX@^3.5.1
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3

[env:native]
platform = native
build_flags =
  -Iinclude
  -Itest/mocks/include
  -Itest/mocks/libs
  -DUNIT_TEST
lib_ignore = components
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> +<../test/mocks/src/>
test_filter = test_game_logic

[env:component_tests]
extends = env:native
test_filter = test_component_*
lib_ignore =
build_flags =
  -Iinclude
  -Ilib/components/ScoreDisplay
  -Ilib/components/LedProgressGrid
  -Ilib/components/ControlPad
  -Ilib/components/TextDisplay
  -Ilib/components/FarkleWarningLights
  -Itest/mocks/include
  -Itest/mocks/libs
  -DUNIT_TEST
build_src_filter = +<*> -<main.cpp> +<../test/mocks/src/> -<../test/mocks/src/ScoreDisplay.cpp> +<../lib/components/ScoreDisplay/ScoreDisplay.cpp> -<../test/mocks/src/LedProgressGrid.cpp> +<../lib/components/LedProgressGrid/LedProgressGrid.cpp> -<../test/mocks/src/ControlPad.cpp> +<../lib/components/ControlPad/ControlPad.cpp> -<../test/mocks/src/TextDisplay.cpp> +<../lib/components/TextDisplay/TextDisplay.cpp> -<../test/mocks/src/TextDisplayV2.cpp> +<../lib/components/TextDisplay/TextDisplayV2.cpp> -<../test/mocks/src/FarkleWarningLights.cpp> +<../lib/components/FarkleWarningLights/FarkleWarningLights.cpp>
